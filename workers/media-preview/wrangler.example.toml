# Example only. DO NOT deploy as part of this development task.
name = "vco-preview-isolated-dev"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[vars]
DEVELOPMENT_ONLY = "true"
APP_ORIGIN = "https://REPLACE-WITH-ISOLATED-DEVELOPMENT-APP"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "REPLACE-WITH-PRIVATE-DEVELOPMENT-BUCKET"
jurisdiction = "eu"
# MEDIA_EDGE_AUTH_SECRET is a Worker secret, never an inline variable.
