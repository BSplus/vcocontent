<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <style>
      html, body { margin:0; background:#11151c; color:#e6e9eb; color-scheme:dark; }
      html[data-app-starting] #root, html[data-app-starting] #root * { visibility:hidden !important; }
      #app-startup { display:none; }
      html[data-app-starting] #app-startup { position:fixed; inset:0; z-index:2147483647; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; background:#11151c; color:#e6e9eb; text-align:center; font:16px/1.5 system-ui,sans-serif; }
      #app-startup p { margin:0; max-width:32rem; }
      #app-startup button { padding:10px 16px; border:1px solid #35404c; border-radius:3px; background:#1a2029; color:#e6e9eb; font:inherit; cursor:pointer; }
      #app-startup button:focus-visible { outline:2px solid #1c9cff; outline-offset:3px; }
      #app-startup [hidden] { display:none !important; }
      .public-html { background:#090d12; color:#f3f4f6; font:18px/1.6 system-ui,sans-serif; min-height:100vh; padding:24px max(20px,calc((100vw - 1200px)/2)); box-sizing:border-box; }
      .public-html a { color:#e7ff5e; }
      .public-html nav,.public-html footer { padding:16px 0; }
      .public-html h1 { font-size:clamp(32px,5vw,64px); line-height:1.1; }
      .public-html img { max-width:100%; object-fit:contain; height:auto; }
      .public-preview-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); gap:20px; }
      .public-preview-grid figure { margin:0; }
    </style>
    <script>
      // Run before the body can paint. Without JS the same public HTML stays visible.
      (() => {
        const html = document.documentElement;
        html.setAttribute("data-app-starting", "");
        let ready = false, committed = false, failed = false, frame = 0;
        let fontsStarted = false, fontsReady = false;
        let slowTimer;
        function updateNotice() {
          if (ready || !html.hasAttribute("data-app-starting")) return;
          const notice = document.getElementById("app-startup");
          if (!notice) return;
          notice.setAttribute("role", failed ? "alert" : "status");
          document.getElementById("startup-message").textContent = failed
            ? "The application could not be loaded. Please try again."
            : "This is taking longer than expected. You can keep waiting or reload the page.";
          document.getElementById("startup-actions").hidden = false;
          document.getElementById("startup-public").hidden = !document.querySelector("#root .public-html");
        }
        function fail() {
          if (ready) return;
          failed = true;
          clearTimeout(slowTimer);
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", updateNotice, { once:true });
          } else updateNotice();
        }
        function prepareFonts() {
          fontsStarted = true;
          let finished = false;
          const finish = usable => {
            if (finished) return;
            finished = true;
            clearTimeout(fontTimer);
            // Freeze the fallback for this page visit, so late font downloads
            // cannot resize content after it is already visible.
            if (!usable) html.setAttribute("data-vco-font-fallback", "");
            fontsReady = true;
            revealWhenStyled();
          };
          const fontTimer = setTimeout(() => finish(false), 2000);
          if (!document.fonts?.load) { finish(false); return; }
          const fonts = [400, 500, 600, 700].map(weight => `${weight} 16px "IBM Plex Sans Condensed"`);
          fonts.push('800 16px "Big Shoulders Display"');
          Promise.all(fonts.map(font => document.fonts.load(font, "VCO Media Database")))
            .then(async faces => {
              await document.fonts.ready;
              finish(faces.every(loaded => loaded.length > 0));
            })
            .catch(() => finish(false));
        }
        function revealWhenStyled() {
          if (ready || !committed) return;
          // This marker comes from the app stylesheet, not the inline shell.
          if (getComputedStyle(html).getPropertyValue("--vco-app-styles").trim() !== "ready") {
            frame = requestAnimationFrame(revealWhenStyled);
            return;
          }
          if (!fontsReady) {
            if (!fontsStarted) prepareFonts();
            return;
          }
          ready = true;
          clearTimeout(slowTimer);
          cancelAnimationFrame(frame);
          html.removeAttribute("data-app-starting");
          document.getElementById("app-startup")?.remove();
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", fail);
        }
        function onError(event) {
          const target = event.target;
          if ((target instanceof HTMLScriptElement && target.type === "module") ||
              (target instanceof HTMLLinkElement && target.rel === "stylesheet") ||
              event instanceof ErrorEvent) fail();
        }
        window.__appStartup = {
          committed() { committed = true; revealWhenStyled(); },
          failed: fail,
          reload() { window.location.reload(); },
          showPublic() {
            if (!document.querySelector("#root .public-html")) return;
            html.removeAttribute("data-app-starting");
            clearTimeout(slowTimer);
          }
        };
        window.addEventListener("error", onError, true);
        window.addEventListener("unhandledrejection", fail);
        // A timeout offers recovery, never declares a slow connection a failure.
        slowTimer = setTimeout(updateNotice, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-startup" role="status" aria-live="polite">
      <p id="startup-message">Loading VCO Media Database…</p>
      <div id="startup-actions" hidden>
        <button type="button" onclick="window.__appStartup.reload()">Reload page</button>
        <button id="startup-public" type="button" hidden onclick="window.__appStartup.showPublic()">View public page</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
