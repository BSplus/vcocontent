<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <style>
      .public-html { background:#090d12; color:#f3f4f6; font:18px/1.6 system-ui,sans-serif; min-height:100vh; padding:24px max(20px,calc((100vw - 1200px)/2)); box-sizing:border-box; }
      .public-html a { color:#e7ff5e; }
      .public-html nav,.public-html footer { padding:16px 0; }
      .public-html h1 { font-size:clamp(32px,5vw,64px); line-height:1.1; }
      .public-html img { max-width:100%; object-fit:contain; height:auto; }
      .public-preview-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); gap:20px; }
      .public-preview-grid figure { margin:0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // React cannot show its own error boundary if the entry module never loads.
      function showStartupError() {
        const root = document.getElementById("root");
        if (!root || root.hasChildNodes()) return;
        const message = document.createElement("div");
        message.setAttribute("role", "alert");
        message.style.cssText = "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font:16px sans-serif";
        const text = document.createElement("p");
        text.textContent = "The application could not be loaded. Please try again.";
        const retry = document.createElement("button");
        retry.textContent = "Reload page";
        retry.onclick = () => window.location.reload();
        message.append(text, retry);
        root.append(message);
      }
      window.addEventListener("error", (event) => {
        if (event.target instanceof HTMLScriptElement || /module|import/i.test(event.message || "")) showStartupError();
      }, true);
      setTimeout(showStartupError, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
